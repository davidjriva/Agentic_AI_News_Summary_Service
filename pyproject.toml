[tool.poetry]
name = "agentic-ai-news-summary-service"
version = "0.1.0"
description = "Twice-daily Agentic AI news digest service"
authors = ["David Riva"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
anthropic = "^0.40.0"
feedparser = "^6.0.11"
python-dotenv = "^1.0.0"
jinja2 = "^3.1.4"
requests = "^2.32.3"
beautifulsoup4 = "^4.12"
tqdm = "^4.0"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
sqlalchemy = "^2.0"
psycopg = {version = "^3.2", extras = ["binary"]}
alembic = "^1.13"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
httpx = "^0.27.0"
testcontainers = {version = "^4.0", extras = ["postgresql"]}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
